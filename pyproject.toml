[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-sinh"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "marker-pdf",
    "openpyxl",
    "gspread>=6.0",
    "google-auth",
    "pymupdf",
    "pypdf",
    "pytesseract",
    "Pillow",
    "pdfplumber",
    "reportlab",
    "python-dotenv",
    "pyyaml",
    "typer>=0.12",
    "rich",
    "flask",
    "markdown",
]

[project.scripts]
tutor = "tutor:app"

[tool.setuptools]
py-modules = ["tutor", "app"]
packages = ["scripts"]
